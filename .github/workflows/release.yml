#
# Publish a release: build the multi arch image, push it to ghcr.io under the tag
# that matches info.xml <version>, and attach the signed store archive to the
# GitHub release. This is the phase 5 counterpart of the cacheonly build in ci.yml
# (D-25): here, and only here, the image is pushed.
#
# The store submission itself stays a manual step: it needs the private signing
# key that belongs to the merged CSR certificate, which is not a repository
# secret. See docs/store-submission.md. This workflow builds and signs the archive
# only if NC_SIGN_KEY_B64 is present as a secret; otherwise it publishes the
# unsigned archive and the maintainer signs it locally with
# scripts/build_store_release.sh.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive the version from the tag
        id: version
        # v0.1.0 -> 0.1.0. Fail loudly if the tag does not match info.xml <version>,
        # because the store version and the pulled image tag have to be the same.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          xml="$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)"
          if [[ "$tag" != "$xml" ]]; then
            echo "tag $tag does not match info.xml <version> $xml" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcp_connector:${{ steps.version.outputs.version }}

      - name: Build the store archive
        run: scripts/build_store_release.sh "${{ steps.version.outputs.version }}"
        env:
          # Optional: base64 of the signing key. When absent, the archive is built
          # unsigned and the maintainer signs it locally before the store upload.
          NC_SIGN_KEY_B64: ${{ secrets.NC_SIGN_KEY_B64 }}

      - name: Decode the signing key if present
        if: ${{ env.NC_SIGN_KEY_B64 != '' }}
        env:
          NC_SIGN_KEY_B64: ${{ secrets.NC_SIGN_KEY_B64 }}
        run: |
          mkdir -p "$HOME/.nextcloud/certificates"
          echo "$NC_SIGN_KEY_B64" | base64 -d > "$HOME/.nextcloud/certificates/mcp_connector.key"
          scripts/build_store_release.sh "${{ steps.version.outputs.version }}" | tee sign-output.txt

      - name: Attach the archive to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mcp_connector-${{ steps.version.outputs.version }}.tar.gz
