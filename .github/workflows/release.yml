#
# Publish a release: build the multi arch image, push it to ghcr.io under the tag
# that matches info.xml <version>, and attach the signed store archive to the
# GitHub release. This is the phase 5 counterpart of the cacheonly build in ci.yml
# (D-25): here, and only here, the image is pushed.
#
# Two ways in:
#   - push a tag v<version>: the real release, builds, pushes and publishes.
#   - run it by hand (workflow_dispatch) with dry_run=true (the default): builds the
#     multi arch image WITHOUT pushing and builds the store archive WITHOUT a
#     release, so the workflow itself can be tested without publishing anything.
#
# The store submission stays a manual step: it needs the private signing key that
# belongs to the merged CSR certificate, which is not a repository secret. See
# docs/store-submission.md.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not push the image or publish a release"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Decide dry run and version
        id: cfg
        # A tag push is always a real release. A manual run is a dry run unless the
        # operator unticks the box. The version comes from the tag on a tag push and
        # from info.xml on a manual run, and a tag must match info.xml <version>,
        # because the store version and the pulled image tag have to be the same.
        run: |
          xml="$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$xml" ]]; then
              echo "tag $tag does not match info.xml <version> $xml" >&2
              exit 1
            fi
            echo "dry=false" >> "$GITHUB_OUTPUT"
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "version=$xml" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: ${{ steps.cfg.outputs.dry == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the multi arch image (push only on a real release)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.dry == 'false' }}
          tags: ghcr.io/${{ github.repository_owner }}/mcp_connector:${{ steps.cfg.outputs.version }}

      - name: Build the store archive
        run: scripts/build_store_release.sh "${{ steps.cfg.outputs.version }}"

      - name: Attach the archive to the GitHub release
        if: ${{ steps.cfg.outputs.dry == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mcp_connector-${{ steps.cfg.outputs.version }}.tar.gz
