name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen
      # ruff runs over the whole repository, not over src: a lint gate that only sees the
      # package lets scripts, tests and the whitelist rot.
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      # Full confidence plus an annotated whitelist, instead of --min-confidence 80. At 80
      # this step reported nothing at all and could not fail; every remaining finding is
      # justified by one line in vulture_whitelist.py.
      - name: Dead code check
        run: uv run vulture src scripts vulture_whitelist.py
      - name: Unit and contract tests
        run: uv run pytest tests/unit tests/contract
      # Armed at the measured size plus 15 percent (see the comment in the script), so a
      # sixteenth tool or a description that grows into a paragraph fails here.
      - name: Tool budget gate
        run: uv run python scripts/check_tool_budget.py
      - name: Transport matrix (no Docker, no Nextcloud)
        # Client matrix and restart proof run without Nextcloud: tools/list never
        # reaches the cloud. Keeping them here means SRV-01 and SRV-05 are checked on
        # every push, not only in the slower integration job.
        run: uv run pytest -m matrix

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # QEMU is what makes the arm64 half of the matrix runnable on an amd64 runner: the
      # Dockerfile installs packages and unpacks frpc for the target architecture, so
      # those layers execute emulated instead of being cross compiled.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: ExApp image build (no push)
        # Both architectures are built and none of them is published: registry publishing
        # belongs to phase 5 (D-25), so there is no login and no registry step in this
        # workflow at all. cacheonly keeps the build honest without producing an artifact
        # that someone could mistake for a release.
        run: docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly .

  exapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Generate a fresh HaRP shared key
        # compose.exapp.yml requires HP_SHARED_KEY and carries no default (WR-11), and the
        # bootstrap rejects anything that is not 64 hex characters (CR-02). One fresh key per
        # run is handed to every later step through the job environment.
        run: echo "HP_SHARED_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start the HaRP topology
        # --wait honours the healthchecks in compose.exapp.yml, so no sleep is needed. The
        # topology brings its own reverse proxy, deploy daemon and loopback registry,
        # because AppAPI reaches an ExApp through the public Nextcloud URL.
        run: docker compose -f compose.exapp.yml up -d --wait
      - name: Install the app as an ExApp
        # The script builds the image, pushes it into the loopback registry of the
        # topology and registers the app. Nothing is pushed outside; publishing to a
        # public registry belongs to phase 5 (D-25).
        run: bash scripts/bootstrap_exapp.sh
      - name: The ExApp is registered and enabled
        run: |
          docker compose -f compose.exapp.yml exec -T --user www-data nextcloud \
            php occ app_api:app:list | tee exapp-list.txt
          grep -E 'mcp_connector .*\[enabled\]' exapp-list.txt
      - name: Install locked environment
        run: uv sync --frozen
      - name: DAV impersonation matrix over the full chain (AUTH-05)
        # The bootstrap wrote .env.exapp with the deploy identity and both app passwords.
        run: |
          set -a && . ./.env.exapp && set +a
          uv run pytest tests/integration/test_exapp_dav_matrix.py -m integration
      - name: Permission fidelity over the full chain (AUTH-05, D-28)
        # The permission promise proven through HaRP, the ExApp and impersonation: bob finds
        # nothing of alice's, alice finds her own content in the same run.
        run: |
          set -a && . ./.env.exapp && set +a
          uv run pytest tests/integration/test_permission_fidelity_exapp.py -m integration
      - name: Topology and ExApp logs on failure
        if: failure()
        run: |
          docker compose -f compose.exapp.yml logs --tail=200
          docker logs nc_app_mcp_connector --tail=200 || true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Start the test Nextcloud
        # --wait honours the healthcheck in compose.test.yml, so no sleep is needed.
        run: docker compose -f compose.test.yml up -d --wait
      - name: Bootstrap apps, users, calendar and address book
        run: bash scripts/bootstrap_test_nc.sh
      - name: Install locked environment
        run: uv sync --frozen
      - name: Integration tests against Nextcloud
        run: |
          set -a && . ./.env.test && set +a
          uv run pytest -m integration
      - name: Client matrix against the running HTTP server (SRV-01, SRV-05)
        run: |
          set -a && . ./.env.test && set +a
          export NC_MCP_ALLOWED_HOSTS=127.0.0.1
          uv run uvicorn mcp_connector.entry_http:app --host 127.0.0.1 --port 8765 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 0.5
          done
          uv run python tests/compat/modern_client_check.py http://127.0.0.1:8765/mcp
          uv run --isolated --no-project --with "mcp>=1.29,<2" \
            python tests/compat/legacy_client_check.py http://127.0.0.1:8765/mcp
      - name: Nextcloud logs on failure
        if: failure()
        run: docker compose -f compose.test.yml logs --tail=200
